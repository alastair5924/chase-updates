name: Publish approved Windows 11 diagnostic
on:
  push:
    branches: ['auto/windows11-diagnostic-3.3.4']
    paths: ['.github/workflows/windows11-diagnostic.yml']
permissions:
  contents: read
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y innoextract
      - run: python -m pip install bsdiff4==1.2.6
      - run: python diagnostic-3.3.4/reconstruct.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-local-win11-payload
          path: |
            payload.zip
            payload-manifest.json
          retention-days: 7
  package:
    needs: reconstruct
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-local-win11-payload
      - name: Install the exact local packaging compiler
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile inno.exe
          if ((Get-FileHash inno.exe -Algorithm SHA256).Hash.ToLower() -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'Compiler hash mismatch' }
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'pinned-inno'
          $process = Start-Process -FilePath "$PWD/inno.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$compilerRoot") -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Compiler setup failed' }
          "PINNED_ISCC=$compilerRoot/ISCC.exe" >> $env:GITHUB_ENV
      - name: Package the unchanged locally built application files
        shell: pwsh
        run: |
          Expand-Archive payload.zip -DestinationPath payload
          New-Item -ItemType Directory candidate | Out-Null
          & $env:PINNED_ISCC /Q /DAppVersion=3.3.4 "/DPayloadDir=$PWD/payload" "/DOutputDir=$PWD/candidate" diagnostic-3.3.4/chase.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compile failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: win11-installer-candidate
          path: candidate/*.exe
          retention-days: 7
  verify-and-publish:
    needs: [reconstruct, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-local-win11-payload
      - uses: actions/download-artifact@v4
        with:
          name: win11-installer-candidate
          path: candidate
      - run: sudo apt-get update -qq && sudo apt-get install -y innoextract
      - name: Verify every installed application file before publication
        run: python diagnostic-3.3.4/verify.py
      - name: Publish only the approved diagnostic prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          before=$(gh api repos/alastair5924/chase-updates/releases/latest --jq .tag_name)
          gh release create v3.3.4-win11-diagnostic \
            --repo alastair5924/chase-updates --target "$GITHUB_SHA" \
            --title "Chase 3.3.4 Windows 11 diagnostic" \
            --notes-file diagnostic-3.3.4/RELEASE-NOTES.md \
            --draft --prerelease --latest=false \
            candidate/Chase-Setup-3.3.4-windows11-x64.exe \
            candidate/SHA256SUMS.txt candidate/release-verification.json
          gh release edit v3.3.4-win11-diagnostic --repo alastair5924/chase-updates --draft=false --prerelease --latest=false
          after=$(gh api repos/alastair5924/chase-updates/releases/latest --jq .tag_name)
          test "$before" = "$after"
          echo "Published diagnostic prerelease; stable release remains $after"
